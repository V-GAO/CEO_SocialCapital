# Backtest / portfolio construction configuration.

rebalance_frequency: "monthly"

quantiles:
  n_quantiles: 5
  long_quantile: 5
  short_quantile: 1

weighting:
  scheme: "equal"  # "equal" or "value"

transaction_costs:
  cost_bps: 10.0

performance:
  # Research panel (data/processed/panel_with_returns.parquet) is annual
  # (DATE_COL="year", one row per CEO/firm/year) -- periods_per_year must
  # match that granularity, or annualized_return/Sharpe get inflated (e.g.
  # by 12x/sqrt(12) if left at a monthly value of 12).
  periods_per_year: 1
  risk_free_rate: 0.0
  rolling_sharpe_window: 3

fama_macbeth:
  newey_west_lags: 3

out_of_sample:
  train_frac: 0.7
